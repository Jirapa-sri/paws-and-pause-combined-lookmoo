<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paws &amp; Pause — Play link</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Nunito,system-ui,sans-serif;
    background:linear-gradient(180deg,#F7EFDE,#F5E9D3); color:#3A2C22; text-align:center; padding:2rem; }
  h1 { font-family:Georgia,serif; margin:0 0 .5rem; }
  p { max-width:28rem; margin:0 auto 1.25rem; line-height:1.45; color:#6E5C49; }
  img { width:min(72vw,320px); background:#fff; padding:12px; border-radius:12px;
    box-shadow:0 18px 40px -18px rgba(42,30,18,.45); }
  a { color:#3E7C74; word-break:break-all; font-weight:700; }
  code { background:rgba(58,44,34,.08); padding:.15rem .4rem; border-radius:4px; }
</style>
</head>
<body>
  <div>
    <h1>Paws &amp; Pause</h1>
    <p>Same Wi‑Fi as this Mac? Scan the QR code or open the link on your phone or laptop.</p>
    <img id="qr" alt="QR code to play Paws and Pause">
    <p style="margin-top:1.25rem"><a id="play-link" href="#"></a></p>
    <p style="font-size:.9rem">Keep <code>match_server.py</code> running on the host Mac.</p>
  </div>
  <script>
    const url = location.origin + "/game_demo.html";
    const link = document.getElementById("play-link");
    link.href = url;
    link.textContent = url;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=" + encodeURIComponent(url);
  </script>
</body>
</html>
